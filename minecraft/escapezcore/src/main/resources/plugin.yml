name: EscapezCore
version: '${version}'
main: be.escapezcraft.escapezcore.EscapezCorePlugin
api-version: '1.21'
author: birger147
description: EscapezCraft core plugin — GUI, commands, hooks, reports, staffchat, scoreboard, tips, vote, resource pack, custom items, optional database
website: https://example.com/escapezcraft
softdepend:
  - LuckPerms
  - Vault
  - PlaceholderAPI
  - LiteBans
  - WorldGuard
  - Lands
  - McMMO
  - ItemsAdder
  - Nexo
  - ExcellentCrates
  - CoreProtect
  - ProtocolLib
  - CMI

commands:
  ec:
    description: EscapezCore hoofdcommando — opent de GUI of toont help
    usage: /ec [help|report|scoreboard|admin]
    aliases: [escapezcore, escapez]
  discord:
    description: Toon de Discord-link
    usage: /discord
    aliases: [dc]
  website:
    description: Toon de website-link
    usage: /website
    aliases: [web, site]
  vote:
    description: Toon de vote-link
    usage: /vote
    aliases: [stem]
  shop:
    description: Toon de shop-link
    usage: /shop
    aliases: [store]
  regels:
    description: Toon de serverregels-link
    usage: /regels
    aliases: [rules]
  staff:
    description: Toon de staff-informatie-link
    usage: /staff
    aliases: [team]
  report:
    description: Meld een speler bij de staff
    usage: /report <speler> <reden>
    aliases: [meld]
  reports:
    description: Beheer speler-meldingen (staff)
    usage: /reports <list|view|claim|resolve|dismiss|note>
  sc:
    description: Staffchat — toggle of één bericht
    usage: /sc [bericht]
    aliases: [staffchat]
  sb:
    description: Scoreboard aan/uit schakelen
    usage: /sb
    aliases: [scoreboard]

permissions:
  escapezcore.command.*:
    description: Alle EscapezCore basiscommando's
    default: true
    children:
      escapezcore.command.ec: true
      escapezcore.command.discord: true
      escapezcore.command.website: true
      escapezcore.command.vote: true
      escapezcore.command.shop: true
      escapezcore.command.regels: true
      escapezcore.command.staff: true
      escapezcore.command.report: true
      escapezcore.scoreboard.toggle: true
  escapezcore.command.ec:
    description: Gebruik /ec
    default: true
  escapezcore.command.discord:
    description: Gebruik /discord
    default: true
  escapezcore.command.website:
    description: Gebruik /website
    default: true
  escapezcore.command.vote:
    description: Gebruik /vote
    default: true
  escapezcore.command.shop:
    description: Gebruik /shop
    default: true
  escapezcore.command.regels:
    description: Gebruik /regels
    default: true
  escapezcore.command.staff:
    description: Gebruik /staff
    default: true
  escapezcore.command.report:
    description: Gebruik /report
    default: true
  escapezcore.scoreboard.toggle:
    description: Scoreboard zichtbaarheid toggle (/sb of /ec scoreboard)
    default: true
  escapezcore.report.notify:
    description: Ontvang notificaties bij nieuwe reports
    default: op
  escapezcore.report.manage:
    description: Reports beheren (list/view/claim/resolve/dismiss/note)
    default: op
  escapezcore.staff:
    description: Staff-rechten
    default: op
    children:
      escapezcore.report.notify: true
      escapezcore.report.manage: true
      escapezcore.staffchat: true
  escapezcore.staffchat:
    description: Staffchat gebruiken
    default: op
  escapezcore.admin:
    description: Volledige admin-toegang tot /ec admin (verborgen zonder deze perm)
    default: op
    children:
      escapezcore.admin.gui: true
      escapezcore.admin.reload: true
      escapezcore.admin.item: true
      escapezcore.report.manage: true
  escapezcore.admin.gui:
    description: Admin GUI openen
    default: op
  escapezcore.admin.reload:
    description: Config/messages/commands/aliases/gui/resourcepack/items herladen
    default: op
  escapezcore.admin.item:
    description: Custom items beheren (/ec admin item …)
    default: op
    children:
      escapezcore.admin.item.give: true
      escapezcore.admin.item.gui: true
  escapezcore.admin.item.give:
    description: Custom items geven (give/get)
    default: op
  escapezcore.admin.item.gui:
    description: Admin items GUI openen
    default: op
  escapezcore.cooldown.bypass:
    description: Cooldowns omzeilen
    default: op
