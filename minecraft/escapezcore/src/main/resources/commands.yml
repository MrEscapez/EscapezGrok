# Info-commando's — ALLEEN voorbeeld-URL's (vervang later door echte EscapezCraft-links)
# Per-commando opties: enabled, aliases, permission, cooldown-seconds, cooldown-bypass,
# console-allowed, player-only, hidden, logging, message-key, url, description, click-action

discord:
  enabled: true
  aliases: [dc]
  permission: escapezcore.command.discord
  cooldown-seconds: 5
  cooldown-bypass: escapezcore.cooldown.bypass
  console-allowed: true
  player-only: false
  hidden: false
  logging: true
  url: "https://example.com/discord"
  message-key: info-discord
  description: "Toon de Discord-link"
  click-action: open_url

