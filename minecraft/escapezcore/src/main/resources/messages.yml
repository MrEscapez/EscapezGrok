report-list-empty: "<gray>Geen meldingen gevonden.</gray>"
report-list-line: "<gray>#</gray><aqua>{id}</aqua> <dark_gray>|</dark_gray> <yellow>{status}</yellow> <dark_gray>|</dark_gray> <white>{reporter}</white> <gray>→</gray> <white>{target}</white> <dark_gray>—</dark_gray> <gray>{reason}</gray>"
report-not-found: "<red>Geen melding met id </red><yellow>{id}</yellow><red>.</red>"
report-invalid-id: "<red>Ongeldig report-id: </red><yellow>{id}</yellow>"
report-invalid-status: "<red>Ongeldige status: </red><yellow>{status}</yellow><gray> (OPEN, IN_PROGRESS, RESOLVED, DISMISSED)</gray>"
report-view-header: "<gradient:#00E5FF:#7C4DFF><bold>Report #{id}</bold></gradient>"
report-view-line: "<gray>{label}: </gray><white>{value}</white>"
report-view-notes: "<gray>Staff-notities: </gray><white>{notes}</white>"
report-claimed: "<green>Report </green><yellow>#{id}</yellow><green> geclaimd door </green><white>{staff}</white><green>.</green>"
report-already-closed: "<red>Report </red><yellow>#{id}</yellow><red> is al afgesloten (</red><white>{status}</white><red>).</red>"
report-resolved: "<green>Report </green><yellow>#{id}</yellow><green> gemarkeerd als opgelost.</green>"
report-dismissed: "<yellow>Report </yellow><aqua>#{id}</aqua><yellow> afgewezen.</yellow>"
report-note-usage: "<gray>Gebruik: </gray><yellow>/reports note <id> <tekst></yellow>"
report-note-added: "<green>Staff-notitie toegevoegd aan report </green><yellow>#{id}</yellow><green>.</green>"

