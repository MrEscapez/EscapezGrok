# MiniMessage-tags <key> worden ook ondersteund.
prefix: "<gradient:#00E5FF:#7C4DFF><bold>Escapez</bold></gradient><gray> » </gray>"

no-permission: "<red>Je hebt geen toestemming voor dit commando.</red>"
