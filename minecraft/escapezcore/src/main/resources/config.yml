# EscapezCore hoofdconfiguratie
# config-version wordt gebruikt voor merge van defaults bij upgrades
config-version: 8

prefix: "<gradient:#00E5FF:#7C4DFF><bold>Escapez</bold></gradient><gray> » </gray>"

database:
  # Optioneel — plugin start altijd als de DB down is (graceful degrade)
  enabled: false
  # postgresql (prod) | sqlite (dev)
  type: postgresql
  jdbc-url: "jdbc:postgresql://127.0.0.1:5432/escapezcraft"
  username: "escapez"
  # Laat leeg en zet ESCAPEZ_DB_PASSWORD in de omgeving (nooit loggen).
  # Optionele overrides: ESCAPEZ_DB_URL, ESCAPEZ_DB_USER
  password: ""
  # Alleen bij type: sqlite — bestand in plugin data folder
  sqlite-file: "escapezcore.db"
  pool:
    name: EscapezCore-Hikari
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    # 0 = uit; bv. 60000 voor lekdetectie tijdens debug
    leak-detection-threshold-ms: 0

debug: false

cooldowns:
  default-seconds: 3
  info-commands-seconds: 5

gui:
  open-on-ec: true

# Player reports (FASE 5+)
reports:
  enabled: true
  # auto = centrale DatabaseModule (na Flyway) wanneer enabled+ready; anders lokale SQLite; anders YAML
  # Opties: auto | postgres | sqlite | file
  persistence: auto
  cooldown-seconds: 60
  max-reason-length: 256
  list-page-size: 10
  notify-permission: escapezcore.report.notify

# Staffchat (FASE 5+)
staffchat:
  enabled: true
  log-to-console: true
  # Schrijf mee naar staff_chat_logs wanneer DatabaseModule klaar is
  log-to-database: true
  format: "<dark_gray>[</dark_gray><aqua>SC</aqua><dark_gray>]</dark_gray> <white>{player}</white><gray>: </gray><white>{message}</white>"


# Scoreboard / tips / vote-herinneringen: zie scoreboard.yml (FASE 7)

# Resource pack: zie resourcepack.yml (FASE 8)
# Custom items: zie items.yml (FASE 8)

# Soft-deps / plugin hooks: zie integrations.yml (FASE 9)


# Staff Panel API bridge (FASE 10)
# Hybrid: outbound heartbeat/events → Nest; inbound JDK HttpServer for module toggles.
# Secrets: ESCAPEZ_API_KEY (preferred) / ESCAPEZ_HMAC_SECRET — never loggen.
api:
  enabled: false
  base-url: "http://127.0.0.1:3000/api/v1"
  server-id: "survival-1"
  heartbeat-interval-seconds: 30
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  pending-queue-max: 100
  listen:
    enabled: true
    bind: "127.0.0.1"
    port: 8765
  auth:
    # Laat leeg en zet ESCAPEZ_API_KEY in de omgeving (zelfde key-family als Staff Panel BRIDGE_API_KEY).
    api-key: ""
    hmac-enabled: false
    # Optioneel: ESCAPEZ_HMAC_SECRET
    hmac-secret: ""
